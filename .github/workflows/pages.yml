# .github/workflows/pages.yml
name: Deploy Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  actions: read      # download the latest map-health artifact
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      # Per-map "Working in ATAK" status from the latest weekly ATAK harness
      # run (Map Health Check). Missing just means no status on the site.
      - name: Latest map health
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow map-health-check.yml --status completed --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -n "$run" ]; then gh run download "$run" --repo "$GITHUB_REPOSITORY" --name map-health --dir . || echo "No map-health artifact in run $run"; fi
      - name: Generate catalog + QR codes
        run: uv run --extra docs python scripts/gen_pages_catalog.py
      - name: Build site (strict)
        run: uv run --extra docs mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
