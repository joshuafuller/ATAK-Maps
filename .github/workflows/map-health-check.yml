name: Map Health Check

on:
  schedule:
    - cron: "0 0 * * 0"  # Sunday midnight UTC
  workflow_dispatch:

permissions:
  issues: write
  actions: write   # start a Pages rebuild so the explorer shows fresh health

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3

      - name: Install dependencies
        run: uv sync

      # Every map, fetched exactly as ATAK does. Writes per-map health for the
      # site, opens a "Map Health" issue for each failing map and closes it
      # when the map works again. Fails the run on any error.
      - name: ATAK harness (all maps)
        run: uv run python -m mapvalidator --harness . --issues --json map-health.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The Pages build downloads this to show "Working in ATAK" per map.
      - name: Save map health for the site
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: map-health
          path: map-health.json
          retention-days: 30
          if-no-files-found: ignore

      - name: Rebuild the site with the new health
        if: always()
        run: gh workflow run pages.yml --ref master
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
