name: Docs and Dependency CI

on:
  pull_request:
    paths:
      - ".github/workflows/docs-ci.yml"
      - "docs/**"
      - "mkdocs.yml"
      - "pyproject.toml"
      - "uv.lock"
      - "scripts/gen_pages_catalog.py"
      - "scripts/site_check.py"
      - "overrides/**"
      - "mapvalidator/explorer.py"

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Test validator
        run: uv run --extra dev pytest --cov=mapvalidator --cov-fail-under=80
      - name: Generate catalog pages
        run: uv run --extra docs python scripts/gen_pages_catalog.py
      - name: Build documentation
        run: uv run --extra docs mkdocs build --strict
      # Every page in a real browser: no script errors, no axe accessibility
      # violations, the map explorer has its maps, no overlapping map controls.
      - name: Install Chromium
        run: uv run --extra site playwright install --with-deps chromium
      - name: Check the built site
        run: uv run --extra site python scripts/site_check.py site
