name: Update Map Catalog

on:
  push:
    branches: [master]
    paths:
      - "**/*.xml"
      - "maps/descriptions.yml"

# Least privilege by default; the job below asks for write where it needs it.
permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3

      - name: Generate catalog
        run: uv run python scripts/generate_readme_catalog.py

      - name: Commit updated catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet README.md || {
            git add README.md
            git commit -m "docs: auto-update map catalog [skip ci]"
            git push
          }
