name: Map Health Check

on:
  schedule:
    - cron: "0 0 * * 0"  # Sunday midnight UTC
  workflow_dispatch:

permissions:
  issues: write
  actions: write   # start a Pages rebuild so the explorer shows fresh health

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync

      - name: Run liveness probes and manage issues
        run: uv run python -m mapvalidator --probe --issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Every map, fetched exactly as ATAK does; fails the run on any error.
      - name: ATAK harness (all maps)
        if: always()
        run: uv run python -m mapvalidator --harness . --json map-health.json

      # The Pages build downloads this to show "Working in ATAK" per map.
      - name: Save map health for the site
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: map-health
          path: map-health.json
          retention-days: 30
          if-no-files-found: ignore

      - name: Rebuild the site with the new health
        if: always()
        run: gh workflow run pages.yml --ref master
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
